# GoReleaser configuration for bilge
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    # Run go mod tidy in each app directory
    - sh -c "cd dev-cache && go mod tidy"
    - sh -c "cd git-cleaner && go mod tidy"
    - sh -c "cd bilge-macos && go mod tidy"

builds:
  # dev-cache binary
  - id: dev-cache
    main: ./main.go
    dir: ./dev-cache
    binary: dev-cache
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # git-cleaner binary
  - id: git-cleaner
    main: ./main.go
    dir: ./git-cleaner
    binary: git-cleaner
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  # bilge-macos binary
  - id: bilge-macos
    main: ./main.go
    dir: ./bilge-macos
    binary: bilge-macos
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: bilge
    main: ./cmd/bilge
    binary: bilge
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: bilge-linux
    main: ./cmd/platform-bilge
    binary: bilge-linux
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: bilge-windows
    main: ./cmd/platform-bilge
    binary: bilge-windows
    env:
      - CGO_ENABLED=0
    goos: [windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  # Combined archive for Homebrew and platform installers
  - id: bilge
    name_template: "bilge-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*  # Only include binaries, no extra files

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - 'typo'
  groups:
    - title: 'New Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Other Changes'
      order: 999

# Homebrew tap configuration
homebrew_casks:
  - name: bilge
    # Use the bilge archive which includes all binaries
    ids:
      - bilge

    # List all three binaries to install
    binaries:
      - bilge
      - dev-cache
      - git-cleaner
      - bilge-macos

    repository:
      owner: everydaydevopsio
      name: homebrew-bilge-pump
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/everydaydevopsio/bilge-pump
    description: "Collection of Go CLI tools for reclaiming disk space on development machines"

    # Caveats to display after installation
    caveats: |
      bilge includes three utilities:
        • bilge - Unified scan and cleanup command
        • dev-cache     - Scans for project cache directories
        • git-cleaner   - Finds and optimizes .git directories
        • bilge-macos - macOS cleanup commands
        • bilge-linux / bilge-windows - OS-specific cleanup commands

      Quick start:
        bilge scan
        bilge clean --all
        bilge --init

      Documentation: https://github.com/everydaydevopsio/bilge-pump

    # Remove quarantine attribute on macOS since binaries are not signed/notarized
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bilge"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dev-cache"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/git-cleaner"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bilge-macos"]
          end

release:
  github:
    owner: everydaydevopsio
    name: bilge-pump
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Bilge {{ .Tag }}

    A collection of Go CLI tools for reclaiming disk space on development machines.

    ### Installation

    **Recommended: Homebrew**
    ```bash
    brew tap everydaydevopsio/bilge-pump
    brew install bilge
    ```

    **Alternative: Direct Download**
    Download the binaries for your architecture below and place them in your PATH.

  footer: |
    **Full Changelog**: https://github.com/everydaydevopsio/bilge-pump/compare/{{ .PreviousTag }}...{{ .Tag }}

  name_template: "{{.ProjectName}}-v{{.Version}}"
